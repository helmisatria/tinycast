name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'helmisatria/tinycast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream and start a signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/abue-ammar/tinycast.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Already up to date.'
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:main
          gh workflow run fork-release.yml --repo "$GITHUB_REPOSITORY" --ref main
